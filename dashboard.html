<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My account · Mayo Store</title><link rel="stylesheet" href="assets/css/app.css"></head><body>
<header class="top"><a href="index.html"><b>Mayo Store</b></a><nav><a href="index.html" class="btn sm">Store</a><a href="admin/index.html" class="btn sm" id="adm" hidden>Admin</a><button class="btn sm" id="out">Sign out</button></nav></header>
<main class="wrap"><h1 id="hi">My account</h1><div class="tabs" id="tb"><button data-t="ov">Overview</button><button data-t="orders">My orders</button><button data-t="profile">Profile</button><button data-t="notes">Notifications <span id="nb"></span></button></div><section id="v"></section></main>
<script type="module">
import {supabase,$,esc,fmt,date,toast,need,isAdmin,ORDER_COLS,tabs} from "./src/services/api.js";
const u=await need();let go;
$("#out").onclick=async()=>{await supabase.auth.signOut();location.href="index.html"};
if(await isAdmin())$("#adm").hidden=false;
const prof=async()=>(await supabase.from("profiles").select("*").eq("id",u.id).single()).data||{};
const tag=s=>`<span class="tag ${s}">${s}</span>`;
const myOrders=async()=>{const{data,error}=await supabase.from("orders").select(ORDER_COLS+",order_items(product_name,unit_price,quantity)").order("created_at",{ascending:false});if(error)throw error;return data};
const badge=async()=>{const{count}=await supabase.from("notifications").select("id",{count:"exact",head:true}).eq("is_read",false);$("#nb").textContent=count?`(${count})`:""};
const views={
async ov(v){const[p,o]=await Promise.all([prof(),myOrders()]);$("#hi").textContent="Welcome, "+(p.full_name||p.username||u.email);
 const c=f=>o.filter(f).length;v.innerHTML=`<div class="grid"><div class="card stat"><b>${o.length}</b><span>Total orders</span></div><div class="card stat"><b>${c(x=>["pending","confirmed","processing"].includes(x.status))}</b><span>In progress</span></div><div class="card stat"><b>${c(x=>x.status==="completed")}</b><span>Completed</span></div></div><div class="card"><h3>Recent activity</h3>${o.slice(0,5).map(x=>`<p>${esc(x.order_number)} · ${fmt(x.total)} · ${tag(x.status)} · <span class="mu">${date(x.created_at)}</span></p>`).join("")||'<p class="mu">No orders yet. <a href="index.html#websites" style="color:var(--ac)">Browse the store</a></p>'}</div>`},
async orders(v){const o=await myOrders();v.innerHTML=o.length?o.map(x=>`<div class="card"><div class="row"><b>${esc(x.order_number)}</b><span>${fmt(x.total)}</span><span>${tag(x.status)} ${tag(x.payment_status)}</span><span class="mu">${date(x.created_at)}</span></div><ul>${x.order_items.map(i=>`<li>${esc(i.product_name)} × ${i.quantity} · ${fmt(i.unit_price)}</li>`).join("")}</ul>${x.discount>0?`<p class="mu">Discount (${esc(x.coupon_code)}): −${fmt(x.discount)}</p>`:""}${["unpaid","pending"].includes(x.payment_status)&&x.status!=="cancelled"?`<form data-o="${x.id}" class="row"><input name=ref placeholder="Payment reference / transaction ID" required maxlength=200><button class="btn sm">Submit reference</button></form>`:""}</div>`).join(""):'<p class="mu">No orders yet.</p>';
 v.querySelectorAll("form[data-o]").forEach(f=>f.onsubmit=async e=>{e.preventDefault();const{error}=await supabase.rpc("submit_payment_reference",{p_order:f.dataset.o,p_reference:f.ref.value});error?toast(error.message):(toast("Reference submitted. We'll verify your payment."),go("orders"))})},
async profile(v){const p=await prof();v.innerHTML=`<div class="card"><img class="av" id="av" src="${esc(p.avatar_url||"")}" alt=""> <input type="file" id="file" accept="image/png,image/jpeg,image/webp" style="max-width:300px"><form id="pf"><label>Full name</label><input name=full_name value="${esc(p.full_name)}" maxlength=120><label>Username (letters, numbers, _)</label><input name=username value="${esc(p.username)}" pattern="[A-Za-z0-9_]{3,30}"><label>Phone</label><input name=phone value="${esc(p.phone)}" maxlength=30><label>Email</label><input value="${esc(u.email)}" disabled><button class="btn p">Save profile</button></form></div><div class="card"><h3>Change password</h3><form id="pw"><input name=p type=password minlength=8 required placeholder="New password (min 8)"><button class="btn">Update password</button></form></div>`;
 $("#pf").onsubmit=async e=>{e.preventDefault();const f=e.target;const{error}=await supabase.from("profiles").update({full_name:f.full_name.value.trim()||null,username:f.username.value.trim()||null,phone:f.phone.value.trim()||null}).eq("id",u.id);toast(error?(error.code==="23505"?"Username taken":error.message):"Profile saved")};
 $("#pw").onsubmit=async e=>{e.preventDefault();const{error}=await supabase.auth.updateUser({password:e.target.p.value});toast(error?error.message:"Password updated");e.target.reset()};
 $("#file").onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>2097152)return toast("PNG/JPG/WebP up to 2 MB only");const path=`${u.id}/avatar.${f.type.split("/")[1]}`;const up=await supabase.storage.from("user-avatars").upload(path,f,{upsert:true,contentType:f.type});if(up.error)return toast(up.error.message);const url=supabase.storage.from("user-avatars").getPublicUrl(path).data.publicUrl+"?t="+Date.now();await supabase.from("profiles").update({avatar_url:url}).eq("id",u.id);$("#av").src=url;toast("Avatar updated")}},
async notes(v){const{data,error}=await supabase.from("notifications").select("*").order("created_at",{ascending:false}).limit(50);if(error)throw error;v.innerHTML=data.length?data.map(n=>`<div class="card" style="${n.is_read?"opacity:.6":""}"><b>${esc(n.title)}</b> <span class="mu">${date(n.created_at)}</span><p>${esc(n.message)}</p>${n.is_read?"":`<button class="btn sm" data-r="${n.id}">Mark read</button>`}</div>`).join(""):'<p class="mu">No notifications.</p>';
 v.onclick=async e=>{const id=e.target.dataset.r;if(id){await supabase.from("notifications").update({is_read:true}).eq("id",id);go("notes");badge()}}}};
go=tabs($("#tb"),views);badge();
supabase.channel("me").on("postgres_changes",{event:"*",schema:"public",table:"notifications",filter:`user_id=eq.${u.id}`},p=>{toast(p.new?.title||"Update");badge()}).on("postgres_changes",{event:"UPDATE",schema:"public",table:"orders",filter:`user_id=eq.${u.id}`},()=>go($("#tb .on").dataset.t)).subscribe();
</script></body></html>
